<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Página não encontrada — Group Construtora</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a1226" />
  <link rel="icon" href="/assets/logo-256.png" />
  <style>
    :root{--bg:#0a1226;--bg2:#070a14;--text:#f7f9ff;--muted:rgba(247,249,255,.66);--gold:#f1c76a;--orange:#ff7a18}
    *{box-sizing:border-box}
    html{background:var(--bg2)}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:300;line-height:1.7;text-align:center;padding:32px 22px}
    main{max-width:520px}
    img{width:96px;height:96px;display:block;margin:0 auto 28px}
    .k{color:var(--gold);font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
    h1{font-family:"Cormorant Garamond","Times New Roman",serif;font-weight:300;font-size:clamp(34px,7vw,56px);line-height:1.05;margin:14px 0 16px}
    p{color:var(--muted);margin:0 0 34px}
    a.pill{display:inline-flex;align-items:center;gap:12px;padding:15px 28px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;text-decoration:none;transition:background .4s,color .4s}
    a.pill:hover,a.pill:focus{background:var(--gold);color:var(--bg)}
  </style>
</head>
<body>
  <main>
    <a href="/"><img src="/assets/logo-256.png" alt="Group Construtora" width="96" height="96" /></a>
    <div class="k">Erro 404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou mudou de lugar.</p>
    <a class="pill" href="/">Voltar para a página inicial</a>
  </main>
</body>
</html>
